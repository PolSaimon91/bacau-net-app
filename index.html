<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bacău.NET">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css?v=32">
  <title>Bacău.NET</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Bacău<span>.NET</span></div>
    <button id="searchBtn" class="iconbtn" aria-label="Căutare">⌕</button>
  </header>

  <div id="searchBox" class="search hidden">
    <input id="searchInput" type="search" placeholder="Caută în știri…" autocomplete="off">
  </div>

  <nav id="chips" class="chips">
    <button class="chip active" data-cat="all">Acasă</button>
    <button class="chip" data-cat="stiri bacau">Bacău</button>
    <button class="chip" data-cat="eveniment">Eveniment</button>
    <button class="chip" data-cat="general">General</button>
    
  </nav>

  <main>
    <section id="homeView">
      <div id="status" class="status">Se încarcă știrile…</div>
      <div id="feed" class="feed"></div>
    </section>

    <section id="savedView" class="hidden">
      <h1>Salvate</h1>
      <div id="savedFeed" class="feed"></div>
    </section>

    <section id="readerView" class="hidden reader">
<div class="readerbar"><button id="readerBack" class="readerBack">‹ Acasă</button><div class="readerActions"><button id="readerSave">♡</button><button id="readerShare">↗</button></div></div>
<div id="readerContent"></div></section>
<section id="aboutView" class="hidden about">
      <h1>Bacău.NET</h1>
      <p>Client personal pentru iPhone. Știrile sunt preluate din sursele publice Bacău.NET, iar articolele se deschid pe site-ul original.</p>
      <p>Favoritele sunt păstrate numai pe acest dispozitiv.</p>
      <a href="https://www.bacau.net/" target="_blank" rel="noopener">Deschide Bacău.NET ↗</a>
    </section>
  </main>

  <nav class="bottom">
    <button data-view="home" class="tab active"><b>⌂</b><small>Acasă</small></button>
    <button data-view="saved" class="tab"><b>♡</b><small>Salvate</small></button>
    <button id="searchTab" class="tab"><b>⌕</b><small>Căutare</small></button>
    <button data-view="about" class="tab"><b>ⓘ</b><small>Despre</small></button>
  </nav>
</div>
<script src="./app.js?v=32"></script>
<script>document.getElementById('searchTab').onclick=()=>{document.getElementById('searchBox').classList.remove('hidden');document.getElementById('searchInput').focus();}</script></body>
</html>
